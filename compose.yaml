services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: rag
      POSTGRES_USER: ${DB_USERNAME:-rag}
      POSTGRES_PASSWORD: "${DB_PASSWORD:?请先在项目根目录的.env中配置DB_PASSWORD}"

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
