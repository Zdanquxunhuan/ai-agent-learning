spring:
  application:
    name: rag-service

  config:
    import: "optional:file:./.env[.properties]"

  profiles:
    default: local

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

  datasource:
    url: "${DB_URL:jdbc:postgresql://localhost:5432/rag}"
    username: "${DB_USERNAME:rag}"
    password: "${DB_PASSWORD}"


server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

rag:
  model:
    enabled: ${RAG_MODEL_ENABLED:false}
    base-url: "${RAG_MODEL_BASE_URL:}"
    name: "${RAG_MODEL_NAME:}"
    api-key: "${RAG_MODEL_API_KEY:}"

  chunking:
    max-chunk-size: 500
    overlap-size: 50

  storage:
      upload-dir: ${RAG_UPLOAD_DIR:./data/uploads}


  embedding:
    provider: siliconflow
    base-url: ${SILICONFLOW_BASE_URL:https://api.siliconflow.cn/v1}
    api-key: ${SILICONFLOW_API_KEY:}
    model: ${SILICONFLOW_EMBEDDING_MODEL:BAAI/bge-m3}
    dimensions: ${SILICONFLOW_EMBEDDING_DIMENSIONS:1024}
    connect-timeout: ${SILICONFLOW_CONNECT_TIMEOUT:3s}
    read-timeout: ${SILICONFLOW_READ_TIMEOUT:30s}
    requests-per-second: ${SILICONFLOW_REQUESTS_PER_SECOND:2}


  rerank:
    provider: ${RAG_RERANK_PROVIDER:identity}
    base-url: ${RAG_RERANK_BASE_URL:https://api.siliconflow.cn/v1}
    api-key: ${RAG_RERANK_API_KEY:${SILICONFLOW_API_KEY:}}
    model: ${RAG_RERANK_MODEL:BAAI/bge-reranker-v2-m3}
    connect-timeout: ${RAG_RERANK_CONNECT_TIMEOUT:3s}
    read-timeout: ${RAG_RERANK_READ_TIMEOUT:10s}

  llm:
    provider: ${RAG_LLM_PROVIDER:fake}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    api-key: ${DEEPSEEK_API_KEY:}
    model: ${DEEPSEEK_MODEL:deepseek-flash}
    connect-timeout: ${DEEPSEEK_CONNECT_TIMEOUT:3s}
    read-timeout: ${DEEPSEEK_READ_TIMEOUT:30s}
    max-tokens: ${RAG_LLM_MAX_TOKENS:1200}
    temperature: ${RAG_LLM_TEMPERATURE:0.2}
    max-context-chars: ${RAG_LLM_MAX_CONTEXT_CHARS:12000}

  answer:
    evidence-policy:
      # Initial heuristic; calibrate against the fixed test set, not a universal truth.
      minimum-semantic-similarity: ${RAG_MIN_SEMANTIC_SIMILARITY:0.35}
      minimum-strong-evidence-count: ${RAG_MIN_STRONG_EVIDENCE_COUNT:1}
      # Lets exact identifiers / error codes found by keyword search pass when similarity is absent.
      allow-keyword-match: ${RAG_ALLOW_KEYWORD_MATCH:true}



