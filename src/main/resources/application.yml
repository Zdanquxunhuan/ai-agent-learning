spring:
  application:
    name: rag-service

  config:
    import: "optional:file:./.env[.properties]"

  profiles:
    default: local

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

  datasource:
    url: "${DB_URL:jdbc:postgresql://localhost:5432/rag}"
    username: "${DB_USERNAME:rag}"
    password: "${DB_PASSWORD}"


server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

rag:
  model:
    enabled: ${RAG_MODEL_ENABLED:false}
    base-url: "${RAG_MODEL_BASE_URL:}"
    name: "${RAG_MODEL_NAME:}"
    api-key: "${RAG_MODEL_API_KEY:}"

  chunking:
    max-chunk-size: 500
    overlap-size: 50

  storage:
      upload-dir: ${RAG_UPLOAD_DIR:./data/uploads}


  embedding:
    provider: siliconflow
    base-url: ${SILICONFLOW_BASE_URL:https://api.siliconflow.cn/v1}
    api-key: ${SILICONFLOW_API_KEY:}
    model: ${SILICONFLOW_EMBEDDING_MODEL:BAAI/bge-m3}
    dimensions: ${SILICONFLOW_EMBEDDING_DIMENSIONS:1024}
    connect-timeout: ${SILICONFLOW_CONNECT_TIMEOUT:3s}
    read-timeout: ${SILICONFLOW_READ_TIMEOUT:30s}
    requests-per-second: ${SILICONFLOW_REQUESTS_PER_SECOND:2}
