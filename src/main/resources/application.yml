spring:
  application:
    name: rag-service

  config:
    import: "optional:file:./.env[.properties]"

  profiles:
    default: local

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

  rag:
    storage:
      upload-dir: ${RAG_UPLOAD_DIR:./data/uploads}

  datasource:
    url: "${DB_URL:jdbc:postgresql://localhost:5432/rag}"
    username: "${DB_USERNAME:rag}"
    password: "${DB_PASSWORD}"


server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

rag:
  model:
    enabled: ${RAG_MODEL_ENABLED:false}
    base-url: "${RAG_MODEL_BASE_URL:}"
    name: "${RAG_MODEL_NAME:}"
    api-key: "${RAG_MODEL_API_KEY:}"

  chunking:
    max-chunk-size: 500
    overlap-size: 50
